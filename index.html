<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MacBook Neo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f7;
        }

        /* Menu */
        .menu {
            padding: 10px;
        }

        .menu a {
            margin: 0 15px;
            text-decoration: none;
            color: black;
            font-size: 14px;
        }

        /* Nội dung */
        .hero {
            margin-top: 50px;
        }

        h1 {
            font-size: 60px;
            margin: 10px 0;
        }

        p {
            font-size: 22px;
            color: #555;
        }

        /* Button */
        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            margin: 10px;
            display: inline-block;
        }

        .btn-blue {
            background: #0071e3;
            color: white;
        }

        .btn-outline {
            border: 1px solid #0071e3;
            color: #0071e3;
        }

        /* Image */
        img {
            width: 500px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Menu -->
    <div class="menu">
        <a href="#">Store</a>
        <a href="#">Mac</a>
        <a href="#">iPad</a>
        <a href="#">iPhone</a>
        <a href="#">Watch</a>
    </div>

    <!-- Nội dung -->
    <div class="hero">
        <h1>MacBook Neo</h1>
        <p>Amazing Mac. Surprising price.</p>

        <a href="#" class="btn btn-blue">Learn more</a>
        <a href="#" class="btn btn-outline">Buy</a>

        <br>

        <img src=https:"https://cdn.mos.cms.futurecdn.net/mc5YNiwiKoXBXpeitPF9Hm.jpg" alt="MacBook">
    </div>

</body>
</html>
